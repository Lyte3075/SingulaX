<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SingulaX Easter Eggs</title>

  <style>
    /*
      ============================================================
      SINGULAX EASTER EGGS
      EASY EDIT AREA
      ------------------------------------------------------------
      Most of the content you will want to change is in the
      JavaScript arrays near the bottom of this file.

      You can add, remove, or edit an Easter egg like this:

        {
          title: "My Easter Egg",
          icon: "🥚",
          description: "What it does.",
          secret: "How to find it."
        }

      You can add a file extension like this:

        {
          extension: ".example",
          name: "Example Source File",
          description: "SingulaX source code."
        }

      You do NOT need to change the HTML below when adding items.
      ============================================================
    */

    :root {
      --bg: #05060b;
      --panel: #0c0f18;
      --panel-2: #111624;
      --border: #252b3d;
      --text: #f4f6ff;
      --muted: #9da6bd;
      --accent: #61d8ff;
      --accent-2: #9a6cff;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(97,216,255,.12), transparent 35%),
        radial-gradient(circle at 85% 10%, rgba(154,108,255,.14), transparent 35%),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 42px 22px 26px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .22em;
      color: var(--accent);
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(32px, 7vw, 58px);
      line-height: 1;
      background: linear-gradient(90deg, var(--accent), #8c8cff, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 700px;
      color: var(--muted);
      font-size: 16px;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 32px auto 70px;
    }

    section {
      margin-bottom: 38px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
      font-size: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }

    .card {
      padding: 19px;
      background: linear-gradient(145deg, var(--panel-2), var(--panel));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: transform .15s ease, border-color .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #46506d;
    }

    .egg-icon {
      font-size: 28px;
    }

    .card h3 {
      margin: 9px 0 7px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .secret {
      margin-top: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(97,216,255,.06);
      border: 1px solid rgba(97,216,255,.13);
      color: #c8efff;
      font-size: 14px;
    }

    .extension {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .extension-name {
      font-size: 19px;
      font-weight: 800;
      color: var(--accent);
    }

    .extension-full {
      font-weight: 700;
    }

    .empty {
      padding: 25px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    footer {
      padding: 25px;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">SingulaX</div>
    <h1>🥚 Easter Eggs</h1>
    <p class="subtitle">
      Hidden features, fun secrets, and the full list of SingulaX source-file extensions.
    </p>
  </header>

  <main>
    <section>
      <h2 class="section-title">🥚 Easter Eggs</h2>
      <div id="easterEggs" class="grid"></div>
    </section>

    <section>
      <h2 class="section-title">📁 File Extension Vault</h2>
      <div id="extensions" class="grid"></div>
    </section>
  </main>

  <footer>
    SingulaX • Keep exploring.
  </footer>

  <script>
    /*
      ============================================================
      EDIT THESE ARRAYS
      ============================================================

      Add new Easter eggs here.
    */
    const EASTER_EGGS = [
      /*
      {
        title: "Example Easter Egg",
        icon: "🥚",
        description: "Describe the secret here.",
        secret: "Tell people how to find it here."
      }
      */
    ];

    /*
      Add or edit file extensions here.
      Every extension listed here can represent SingulaX source code.
    */
    const FILE_EXTENSIONS = [
      {
        extension: ".sglx",
        name: "SingulaX Source",
        description: "The standard SingulaX source-file extension."
      },
      {
        extension: ".txt",
        name: "Plain Text",
        description: "A plain-text file that can also contain SingulaX source code."
      },
      {
        extension: ".vlla",
        name: "SingulaX Source",
        description: "Alternative SingulaX source-file extension."
      },
      {
        extension: ".cyln",
        name: "SingulaX Source",
        description: "Alternative SingulaX source-file extension."
      },
      {
        extension: ".smsc",
        name: "SingulaX Source",
        description: "Alternative SingulaX source-file extension."
      },
      {
        extension: ".wsc",
        name: "SingulaX Source",
        description: "Alternative SingulaX source-file extension."
      },
      {
        extension: ".ctrsc",
        name: "SingulaX Source",
        description: "Alternative SingulaX source-file extension."
      },
      {
        extension: ".ezsc",
        name: "SingulaX Source",
        description: "Alternative SingulaX source-file extension."
      },
      {
        extension: ".lyte3075",
        name: "SingulaX Source",
        description: "Alternative SingulaX source-file extension."
      }
    ];

    /*
      ============================================================
      DO NOT EDIT BELOW HERE UNLESS YOU WANT TO CHANGE THE LAYOUT
      ============================================================
    */

    function renderEasterEggs() {
      const root = document.getElementById("easterEggs");

      if (!EASTER_EGGS.length) {
        root.innerHTML =
          '<div class="empty">No Easter eggs have been added yet. Add one to the EASTER_EGGS array above! 🥚</div>';
        return;
      }

      root.innerHTML = EASTER_EGGS.map(egg => `
        <article class="card">
          <div class="egg-icon">${escapeHTML(egg.icon || "🥚")}</div>
          <h3>${escapeHTML(egg.title)}</h3>
          <p>${escapeHTML(egg.description)}</p>
          ${egg.secret ? `<div class="secret">🔐 ${escapeHTML(egg.secret)}</div>` : ""}
        </article>
      `).join("");
    }

    function renderExtensions() {
      const root = document.getElementById("extensions");

      root.innerHTML = FILE_EXTENSIONS.map(file => `
        <article class="card extension">
          <code class="extension-name">${escapeHTML(file.extension)}</code>
          <div class="extension-full">${escapeHTML(file.name)}</div>
          <p>${escapeHTML(file.description)}</p>
        </article>
      `).join("");
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderEasterEggs();
    renderExtensions();
  </script>
</body>
</html>
