<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b14"><title>SingulaX Account</title>
<style>
:root{color-scheme:dark;--bg:#080a12;--panel:#111522;--panel2:#151a2a;--text:#edf1ff;--muted:#8e98b8;--accent:#7d7cff;--border:#272e47}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#19142d 0,#080a12 46%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:rgba(17,21,34,.96);border:1px solid var(--border);border-radius:22px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.brand{font-weight:900;font-size:25px}.brand span{background:linear-gradient(90deg,#4cc9ff,#7d7cff,#b04cff);-webkit-background-clip:text;background-clip:text;color:transparent}h1{margin:24px 0 7px;font-size:32px}p{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{width:100%;background:#0b0f1a;border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px;font-size:16px}button,a{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:11px;padding:11px 14px;text-decoration:none;cursor:pointer;font:inherit}.primary{background:linear-gradient(135deg,#595cff,#a448ff);border:0;font-weight:800;width:100%}.actions{display:flex;gap:9px;margin-top:16px}.actions>*{flex:1;text-align:center}.status{margin:14px 0;color:#aeb8d8;min-height:22px}.error{color:#ff8f9c}.signed{display:grid;gap:12px}.hint{font-size:12px;color:#737d9c}.profile{display:flex;align-items:center;gap:16px;margin:20px 0;padding:16px;border:1px solid var(--border);border-radius:16px;background:#0d111d}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid #363d5c;background:linear-gradient(135deg,#4be0e3,#9b6cff);display:grid;place-items:center;font-size:28px;font-weight:900;flex:none}.profileInfo{min-width:0}.profileInfo strong{font-size:20px}.profileInfo small{display:block;color:var(--muted);margin-top:3px}.avatarActions{display:flex;gap:8px;flex-wrap:wrap}.avatarActions button{padding:8px 11px}
</style></head>
<body><main class="card">
<div style="display:flex;align-items:center;gap:10px;justify-content:space-between"><div class="brand">◆ <span>SingulaX Account</span></div><button id="navigate">Navigate</button></div>
<h1>Your SingulaX account.</h1>
<p>Your account uses only a username and password. No email address or email verification is required.</p>
<form id="authForm">
<div class="field"><label>Username</label><input id="usernameInput" autocomplete="username" autocapitalize="none" maxlength="24" placeholder="Bob" required></div>
<div class="field"><label>Password</label><input id="passwordInput" type="password" autocomplete="current-password" minlength="6" required></div>
<div class="field"><label>Action</label><select id="mode"><option value="signin">Sign in</option><option value="signup">Create account</option></select></div>
<button id="submit" class="primary">Sign in</button>
</form>
<div id="signedIn" class="signed" hidden>
<div class="profile">
  <img id="avatarPreview" class="avatar" alt="Profile picture" hidden>
  <div id="avatarFallback" class="avatar"></div>
  <div class="profileInfo"><strong id="username"></strong><small>SingulaX account</small><div class="avatarActions"><label for="avatarInput" style="border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:8px 11px;cursor:pointer">Change picture</label><button id="removeAvatar" type="button">Remove</button><input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div></div>
</div>
<p class="hint">Your profile picture is shown on your SingulaX account and Community projects.</p>
<div class="actions"><button id="projects">My Projects</button><button id="signOut">Sign out</button></div>
</div>
<div id="status" class="status"></div>
</main>
<div id="navModal" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:18px">
  <div style="width:min(500px,100%);background:#111522;border:1px solid var(--border);border-radius:18px;padding:20px">
    <h2 style="margin-top:0">Where do you want to go?</h2>
    <div style="display:grid;gap:10px">
      <button class="navChoice primary" data-go="full-ide.html">SingulaX IDE</button>
      <button class="navChoice" data-go="community.html">Community</button>
      <button class="navChoice" data-go="my-projects.html">My Projects</button>
      <button class="navChoice" data-go="https://lyte3075.github.io/SingulaX/">Homepage</button>
    </div>
    <button id="closeNav" style="margin-top:14px;width:100%">Cancel</button>
  </div>
</div>
<script>
const navModal=document.getElementById('navModal');
document.getElementById('navigate').onclick=()=>navModal.style.display='flex';
document.getElementById('closeNav').onclick=()=>navModal.style.display='none';
document.querySelectorAll('.navChoice').forEach(b=>b.onclick=()=>location.href=b.dataset.go);
navModal.onclick=e=>{if(e.target===navModal)navModal.style.display='none'};
</script>
<script type="module" src="account.js"></script></body></html>
