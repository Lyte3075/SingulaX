<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singulax Studio</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><b>◆ SingulaX Studio Swift</b><input id="projectName" value="MyProject"><select id="fileSelect"></select><button onclick="newFile()">New File</button><button onclick="save()">Save</button><button onclick="run()">▶ Run</button><button onclick="stopRun()">■ Stop</button><button onclick="exportProject()">Export</button><button onclick="document.getElementById('importFile').click()">Import</button><input id="importFile" type="file" accept=".zip" hidden onchange="importProject(event)"><button onclick="toggleMode()" id="modeBtn">Blocks</button></header>
<main><aside><h3>Project</h3><div id="tree"></div><hr><p><b>Live input</b></p><small>Click or type in the game preview. Code can use key_down(), mouse_x(), mouse_y(), mouse_down(), mouse_clicked().</small></aside><section><div id="codePane"><textarea id="editor" spellcheck="false"></textarea></div><div id="blocksPane" hidden><div class="blockbar"><button onclick="addBlock('say')">+ say</button><button onclick="addBlock('if')">+ if</button><button onclick="addBlock('repeat')">+ repeat</button><button onclick="addBlock('while')">+ while</button><button onclick="addBlock('forever')">+ forever</button><button onclick="addBlock('for')">+ for</button><button onclick="addBlock('var')">+ variable</button></div><div id="blocks"></div></div><div class="bottom"><div><h3>Console</h3><pre id="console"></pre></div><div><h3>Game Preview</h3><canvas id="game" width="800" height="450" tabindex="0"></canvas></div></div></section></main>
<script src="app.js"></script></body></html>
