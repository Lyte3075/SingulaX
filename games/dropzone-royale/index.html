<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dropzone Royale</title>
<style>
:root{--bg:#071018;--panel:rgba(8,14,22,.88);--line:rgba(255,255,255,.13);--text:#f5f7fa;--muted:#9ca8b7;--accent:#61e7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);touch-action:none}
canvas{display:block;width:100%;height:100%;background:#15231c}
button,input,select{font:inherit}button{border:1px solid var(--line);background:#101a25;color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}button:hover{background:#172434}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#173145 0,#071018 60%);z-index:20}
.card{width:min(720px,92vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 80px #0008}
h1{margin:0 0 6px;font-size:clamp(34px,7vw,64px);letter-spacing:-2px}h2{margin:24px 0 10px}.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode button{min-height:58px}.mode button.active{outline:2px solid var(--accent);background:#123040}
#play{width:100%;margin-top:16px;background:linear-gradient(135deg,#1e7188,#6848d9);border:0;font-weight:800;font-size:18px;padding:15px}
#status{margin-top:12px;color:var(--muted);min-height:22px}.settings{border-top:1px solid var(--line);margin-top:22px;padding-top:14px}
.controlGrid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.controlGrid input{width:86px;background:#0b131d;border:1px solid var(--line);color:white;border-radius:9px;padding:7px;text-align:center}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start}.pill{background:#071018c9;border:1px solid var(--line);backdrop-filter:blur(8px);padding:8px 11px;border-radius:12px;font-size:13px}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;border-radius:3px}#crosshair:before{width:22px;height:2px;top:10px;left:0}#crosshair:after{width:2px;height:22px;left:10px;top:0}
#touch{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}.stick{position:absolute;width:132px;height:132px;border-radius:50%;border:2px solid #ffffff35;background:#07101855;pointer-events:auto}.knob{position:absolute;width:58px;height:58px;left:35px;top:35px;border-radius:50%;background:#ffffff26;border:1px solid #ffffff44}.leftStick{left:20px;bottom:25px}.rightStick{right:20px;bottom:25px}.actions{position:absolute;right:18px;bottom:175px;display:flex;gap:12px;pointer-events:auto}.action{width:62px;height:62px;border-radius:50%;font-weight:800;background:#071018aa}
@media (pointer:coarse){#touch{display:block}}@media(max-width:600px){.card{padding:20px}.mode{grid-template-columns:1fr}.settings{font-size:14px}}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
  <div class="card">
    <h1>DROPZONE ROYALE</h1>
    <p class="sub">Top-down survival shooter • online multiplayer + adaptive bots</p>
    <div class="mode" id="modes">
      <button data-mode="solo" class="active">Solo<br><small>Bot opponents</small></button>
      <button data-mode="squad">Squad<br><small>4 players / bots</small></button>
      <button data-mode="online">Online<br><small>Players + bots</small></button>
    </div>
    <div class="settings">
      <h2>Controls</h2>
      <div class="controlGrid">
        <label>Move Up</label><input data-bind="up" value="W">
        <label>Move Down</label><input data-bind="down" value="S">
        <label>Move Left</label><input data-bind="left" value="A">
        <label>Move Right</label><input data-bind="right" value="D">
        <label>Sprint</label><input data-bind="sprint" value="SHIFT">
        <label>Interact / Pickup</label><input data-bind="interact" value="E">
      </div>
      <p class="sub">Mouse aims and fires. Gamepads use the left stick to move, right stick to aim, RT/R2 to fire. Touch uses two virtual sticks.</p>
    </div>
    <button id="play">DEPLOY</button>
    <div id="status"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="top">
    <div class="pill" id="stats">❤️ 100 • 🔫 30</div>
    <div class="pill" id="alive">ALIVE 16</div>
  </div>
  <div id="crosshair"></div>
</div>
<div id="touch" class="hidden">
  <div class="stick leftStick" data-stick="move"><div class="knob"></div></div>
  <div class="stick rightStick" data-stick="aim"><div class="knob"></div></div>
  <div class="actions"><button class="action" id="fireTouch">FIRE</button><button class="action" id="reloadTouch">R</button></div>
</div>

<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const menu=document.getElementById("menu"),hud=document.getElementById("hud"),touch=document.getElementById("touch");
const stats=document.getElementById("stats"),aliveEl=document.getElementById("alive"),statusEl=document.getElementById("status");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener("resize",resize);resize();

const cfg={up:"w",down:"s",left:"a",right:"d",sprint:"shift",interact:"e"};
document.querySelectorAll("[data-bind]").forEach(i=>i.addEventListener("change",()=>cfg[i.dataset.bind]=i.value.trim().toLowerCase()));
let mode="solo",running=false,last=0,world,me,actors=[],bullets=[],loot=[],zone,keys=new Set(),mouse={x:W/2,y:H/2,down:false},pads=[],socket=null,netId=null,matchCode="";
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("active",x===b));});
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.key===" "){e.preventDefault()}});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("mousedown",e=>{if(e.button===0)mouse.down=true});
addEventListener("mouseup",()=>mouse.down=false);
canvas.addEventListener("contextmenu",e=>e.preventDefault());

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function norm(x,y){let d=Math.hypot(x,y)||1;return{x:x/d,y:y/d}}
function rand(a,b){return a+Math.random()*(b-a)}
function id(){return Math.random().toString(36).slice(2,9)}
function screenToWorld(x,y){return{x:x+world.cam.x-W/2,y:y+world.cam.y-H/2}}
function aliveCount(){return actors.filter(a=>a.alive).length}

function reset(){
  world={w:3600,h:3600,cam:{x:1800,y:1800},shake:0};
  zone={x:1800,y:1800,r:1600,target:360,phase:0};
  actors=[];bullets=[];loot=[];
  for(let i=0;i<80;i++) loot.push({id:id(),x:rand(100,3500),y:rand(100,3500),type:Math.random()<.7?"ammo":"med",amount:Math.random()<.7?30:35});
  me={id:"local",name:"YOU",x:1800,y:1800,hp:100,maxHp:100,ammo:30,maxAmmo:30,alive:true,team:0,color:"#63e6ff",speed:240,fireCd:0,reload:0,kills:0,bot:false,skill:1};
  actors.push(me);
  const count=mode==="squad"?11:15;
  for(let i=0;i<count;i++) actors.push(makeBot(i+1));
  for(let i=0;i<25;i++) loot.push({id:id(),x:rand(100,3500),y:rand(100,3500),type:"weapon",amount:Math.random()});
}
function makeBot(i){
  const a={id:"b"+i,name:"BOT-"+i,x:rand(200,3400),y:rand(200,3400),hp:100,maxHp:100,ammo:30,maxAmmo:30,alive:true,team:mode==="squad"?i%4: i,color:["#ff6b6b","#ffd166","#b388ff","#8ce99a"][i%4],speed:rand(195,235),fireCd:rand(0,.5),reload:0,kills:0,bot:true,skill:rand(.72,1)};
  a.target=null;a.think=0;a.wander={x:rand(-1,1),y:rand(-1,1)};return a;
}

function nearestEnemy(a){
 let best=null,bd=Infinity;
 for(const b of actors) if(b.alive&&b!==a&&b.team!==a.team){const d=dist(a,b);if(d<bd){bd=d;best=b}}
 return best;
}
function botThink(a,dt){
 a.think-=dt;
 if(a.think<=0){
   a.think=rand(.12,.3);
   const e=nearestEnemy(a);
   if(e&&dist(a,e)<700) a.target=e;
   else a.target=null;
   if(!a.target||Math.random()<.18){
     const dz=Math.hypot(a.x-zone.x,a.y-zone.y);
     if(dz>zone.r*.9){a.wander=norm(zone.x-a.x,zone.y-a.y)}
     else a.wander=norm(rand(-1,1),rand(-1,1));
   }
 }
 let vx=a.wander.x,vy=a.wander.y;
 if(a.target&&a.target.alive){
   const d=dist(a,a.target),to=norm(a.target.x-a.x,a.target.y-a.y);
   const strafe=Math.sin(performance.now()/500+a.x)*.45;
   if(d>330){vx=to.x;vy=to.y}else if(d<170){vx=-to.x;vy=-to.y}
   else {vx=to.x+(-to.y)*strafe;vy=to.y+to.x*strafe}
   const ang=Math.atan2(a.target.y-a.y,a.target.x-a.x);
   if(d<620&&Math.random()<a.skill*.9) shoot(a,ang);
 }
 const zd=Math.hypot(a.x-zone.x,a.y-zone.y);
 if(zd>zone.r) {const z=norm(zone.x-a.x,zone.y-a.y);vx=z.x;vy=z.y}
 move(a,vx,vy,dt);
}
function move(a,vx,vy,dt){
 const n=norm(vx,vy),mult=keys.has(cfg.sprint)&&a===me?1.35:1;
 a.x=clamp(a.x+n.x*a.speed*mult*dt,35,world.w-35);
 a.y=clamp(a.y+n.y*a.speed*mult*dt,35,world.h-35);
}
function shoot(a,ang){
 if(!a.alive||a.reload>0||a.fireCd>0)return;
 if(a.ammo<=0){a.reload=1.25;return}
 a.ammo--;a.fireCd=.12+(1-a.skill)*.08;
 bullets.push({x:a.x+Math.cos(ang)*18,y:a.y+Math.sin(ang)*18,vx:Math.cos(ang)*720,vy:Math.sin(ang)*720,life:1.1,owner:a.id,dmg:18});
}
function damage(a,dmg,owner){
 if(!a.alive)return;
 a.hp-=dmg;
 if(a.hp<=0){a.hp=0;a.alive=false;const k=actors.find(x=>x.id===owner);if(k)k.kills++;for(let i=0;i<2;i++)loot.push({id:id(),x:a.x+rand(-15,15),y:a.y+rand(-15,15),type:"ammo",amount:30})}
}
function playerUpdate(dt){
 let x=0,y=0;
 if(keys.has(cfg.left))x--;if(keys.has(cfg.right))x++;if(keys.has(cfg.up))y--;if(keys.has(cfg.down))y++;
 const gp=navigator.getGamepads?.().find(p=>p);
 if(gp){x=Math.abs(gp.axes[0])>.15?gp.axes[0]:x;y=Math.abs(gp.axes[1])>.15?gp.axes[1]:y;
   const ax=gp.axes[2],ay=gp.axes[3];if(Math.hypot(ax,ay)>.2){mouse.x=W/2+ax*400;mouse.y=H/2+ay*400}
   if(gp.buttons[7]?.pressed)mouse.down=true; else if(gp.buttons[6]?.pressed===false)mouse.down=false;
   if(gp.buttons[0]?.pressed){} 
 }
 move(me,x,y,dt);
 const p=screenToWorld(mouse.x,mouse.y),ang=Math.atan2(p.y-me.y,p.x-me.x);
 if(mouse.down)shoot(me,ang);
 if(me.fireCd>0)me.fireCd-=dt;if(me.reload>0){me.reload-=dt;if(me.reload<=0)me.ammo=me.maxAmmo}
}
function update(dt){
 if(!running)return;
 playerUpdate(dt);
 for(const a of actors)if(a!==me&&a.alive){if(a.fireCd>0)a.fireCd-=dt;if(a.reload>0){a.reload-=dt;if(a.reload<=0)a.ammo=a.maxAmmo}botThink(a,dt)}
 for(const b of bullets){
   b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
   for(const a of actors)if(a.alive&&a.id!==b.owner&&a.team!==actors.find(x=>x.id===b.owner)?.team&&Math.hypot(a.x-b.x,a.y-b.y)<18){damage(a,b.dmg,b.owner);b.life=0;break}
 }
 bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.y>0&&b.x<world.w&&b.y<world.h);
 for(const l of loot){if(me.alive&&dist(me,l)<28){if(l.type==="ammo")me.ammo=clamp(me.ammo+l.amount,0,120);if(l.type==="med")me.hp=clamp(me.hp+l.amount,0,me.maxHp);l.dead=true}}
 loot=loot.filter(l=>!l.dead);
 if(zone.r>zone.target){zone.r-=dt*4}
 for(const a of actors)if(a.alive&&Math.hypot(a.x-zone.x,a.y-zone.y)>zone.r){a.hp-=dt*8;if(a.hp<=0){a.hp=0;a.alive=false}}
 world.cam.x+=(me.x-world.cam.x)*Math.min(1,dt*8);world.cam.y+=(me.y-world.cam.y)*Math.min(1,dt*8);
 if(me.alive&&aliveCount()<=1){running=false;statusEl.textContent=me.alive?"🏆 Victory!":"💀 Eliminated.";menu.classList.remove("hidden");hud.classList.add("hidden");touch.classList.add("hidden")}
 stats.textContent=`❤️ ${Math.ceil(me.hp)} • 🔫 ${me.ammo}`;
 aliveEl.textContent=`ALIVE ${aliveCount()}`;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(!world)return;
 ctx.save();ctx.translate(W/2-world.cam.x,H/2-world.cam.y);
 ctx.fillStyle="#17281e";ctx.fillRect(0,0,world.w,world.h);
 ctx.strokeStyle="#294333";ctx.lineWidth=2;
 for(let x=0;x<world.w;x+=120){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(let y=0;y<world.h;y+=120){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
 for(const l of loot){ctx.fillStyle=l.type==="med"?"#74d680":l.type==="weapon"?"#ffd166":"#d0d5db";ctx.beginPath();ctx.arc(l.x,l.y,7,0,Math.PI*2);ctx.fill()}
 for(const b of bullets){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill()}
 for(const a of actors)if(a.alive){
   ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(a.x,a.y+12,19,8,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(a.x,a.y,15,0,Math.PI*2);ctx.fill();
   const ang=a===me?Math.atan2(screenToWorld(mouse.x,mouse.y).y-a.y,screenToWorld(mouse.x,mouse.y).x-a.x):(a.target?Math.atan2(a.target.y-a.y,a.target.x-a.x):0);
   ctx.strokeStyle="#e7edf3";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x+Math.cos(ang)*25,a.y+Math.sin(ang)*25);ctx.stroke();
   ctx.fillStyle="#10151c";ctx.fillRect(a.x-18,a.y-29,36,5);ctx.fillStyle="#6ee76e";ctx.fillRect(a.x-18,a.y-29,36*(a.hp/a.maxHp),5);
 }
 ctx.fillStyle="rgba(70,120,255,.12)";ctx.fillRect(0,0,world.w,world.h);
 ctx.save();ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.strokeStyle="#67b7ff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function setupTouch(){
 document.querySelectorAll(".stick").forEach(s=>{
   const k=s.querySelector(".knob");let pid=null;
   s.addEventListener("pointerdown",e=>{pid=e.pointerId;s.setPointerCapture(pid);updateStick(e)});
   s.addEventListener("pointermove",e=>{if(e.pointerId===pid)updateStick(e)});
   s.addEventListener("pointerup",()=>{pid=null;k.style.transform="translate(0,0)";if(s.dataset.stick==="move"){keys.delete(cfg.left);keys.delete(cfg.right);keys.delete(cfg.up);keys.delete(cfg.down)}});
   function updateStick(e){const r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.min(48,Math.hypot(dx,dy)),n=norm(dx,dy);k.style.transform=`translate(${n.x*len}px,${n.y*len}px)`;
     if(s.dataset.stick==="move"){keys.delete(cfg.left);keys.delete(cfg.right);keys.delete(cfg.up);keys.delete(cfg.down);if(Math.abs(dx)>12)keys.add(dx<0?cfg.left:cfg.right);if(Math.abs(dy)>12)keys.add(dy<0?cfg.up:cfg.down)}
     else {mouse.x=W/2+dx*4;mouse.y=H/2+dy*4;mouse.down=true}
   }
 });
 fireTouch.onpointerdown=()=>mouse.down=true;fireTouch.onpointerup=()=>mouse.down=false;
 reloadTouch.onpointerdown=()=>{if(me)me.reload=1.25};
}
setupTouch();

async function connect(){
 if(mode!=="online")return;
 try{
   const proto=location.protocol==="https:"?"wss":"ws";
   socket=new WebSocket(`${proto}://${location.host}`);
   socket.onopen=()=>{socket.send(JSON.stringify({type:"join",name:"Player"}));statusEl.textContent="Connected. Bots will fill open slots."};
   socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return};if(m.type==="welcome"){netId=m.id;matchCode=m.match||""}if(m.type==="state"&&running){for(const n of m.players){let a=actors.find(x=>x.id===n.id);if(!a){a={id:n.id,name:n.name||"PLAYER",bot:false,team:n.team||0,color:"#ff8fab",speed:220,fireCd:0,reload:0,kills:0};actors.push(a)}Object.assign(a,n)}}};
   socket.onclose=()=>{if(running)statusEl.textContent="Online server disconnected. Local bots continue."};
 }catch(e){statusEl.textContent="Online mode unavailable, starting local match."}
}
setInterval(()=>{if(socket?.readyState===1&&me?.alive)socket.send(JSON.stringify({type:"input",x:me.x,y:me.y,hp:me.hp,ammo:me.ammo}))},80);

document.getElementById("play").onclick=async()=>{
 document.querySelectorAll("[data-bind]").forEach(i=>cfg[i.dataset.bind]=i.value.trim().toLowerCase());
 reset();running=true;menu.classList.add("hidden");hud.classList.remove("hidden");touch.classList.toggle("hidden",!matchMedia("(pointer:coarse)").matches);statusEl.textContent="";await connect();
};
})();
</script>
</body>
</html>
