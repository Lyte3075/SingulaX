<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b14"><title>SingulaX My Projects</title>
<style>
:root{color-scheme:dark;--bg:#080a12;--panel:#111522;--panel2:#151a2a;--text:#edf1ff;--muted:#8e98b8;--accent:#7d7cff;--border:#272e47}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#19142d 0,#080a12 45%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(8,10,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.brand{font-weight:900;font-size:20px;margin-right:auto}.brand span{background:linear-gradient(90deg,#4cc9ff,#7d7cff,#b04cff);-webkit-background-clip:text;background-clip:text;color:transparent}button,a{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;text-decoration:none;cursor:pointer;font:inherit}.primary{background:linear-gradient(135deg,#595cff,#a448ff);border:0;font-weight:800}.danger{border-color:#5b2b3c;color:#ff9bad}main{max-width:1200px;margin:auto;padding:28px 18px 70px}.hero h1{font-size:clamp(32px,7vw,58px);margin:0 0 8px}.hero p{color:var(--muted);max-width:720px;line-height:1.55}.status{min-height:24px;color:#aeb8d8;margin:14px 0}.error{color:#ff8f9c}.toolbar{display:flex;align-items:center;gap:10px;margin:24px 0 16px;flex-wrap:wrap}.toolbar h2{margin:0 auto 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.project{background:linear-gradient(180deg,rgba(21,26,42,.96),rgba(13,16,27,.96));border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.18)}.projectTop{display:flex;justify-content:space-between;gap:14px}.project h2{margin:0 0 7px}.project p{color:var(--muted);min-height:42px;line-height:1.45}.meta{color:#737d9c;font-size:12px;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{grid-column:1/-1;padding:32px;border:1px dashed var(--border);border-radius:16px;color:var(--muted)}
</style></head>
<body>
<header><div class="brand">◆ <span>SingulaX</span> My Projects</div><button id="navigate">Navigate</button><button id="account">Account</button><button id="signOut">Sign out</button></header>
<main><section class="hero"><h1>Your projects.</h1><p>Cloud projects stay tied to your SingulaX account, so you can return to them later instead of relying only on this browser.</p></section>
<div class="toolbar"><h2 id="count">Loading…</h2><button id="newProject" class="primary">＋ New Project</button></div><div id="status" class="status"></div><section id="grid" class="grid"></section></main>
<div id="navModal" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:18px">
  <div style="width:min(500px,100%);background:#111522;border:1px solid var(--border);border-radius:18px;padding:20px">
    <h2 style="margin-top:0">Where do you want to go?</h2>
    <div style="display:grid;gap:10px">
      <button class="navChoice primary" data-go="full-ide.html">SingulaX IDE</button>
      <button class="navChoice" data-go="community.html">Community</button>
      <button class="navChoice" data-go="my-projects.html">My Projects</button>
      <button class="navChoice" data-go="../../index.html">Homepage</button>
    </div>
    <button id="closeNav" style="margin-top:14px;width:100%">Cancel</button>
  </div>
</div>
<script>
const navModal=document.getElementById('navModal');
document.getElementById('navigate').onclick=()=>navModal.style.display='flex';
document.getElementById('closeNav').onclick=()=>navModal.style.display='none';
document.querySelectorAll('.navChoice').forEach(b=>b.onclick=()=>location.href=b.dataset.go);
navModal.onclick=e=>{if(e.target===navModal)navModal.style.display='none'};
</script>
<script type="module" src="my-projects.js"></script>
</body></html>
